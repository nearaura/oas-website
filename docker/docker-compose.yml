services:
  mongo:
    image: "${MONGO_IMAGE:-docker.m.daocloud.io/library/mongo:8}"
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          "mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@127.0.0.1:27017/admin?authSource=admin"
          --eval "db.adminCommand('ping').ok"
          | grep 1
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    image: oas-website-backend:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        NODE_IMAGE: "${NODE_IMAGE:-docker.m.daocloud.io/library/node:26.13.1-bookworm-slim}"
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      NODE_ENV: production
      PORT: 4322
      TINA_PUBLIC_IS_LOCAL: "false"
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "0.0.0.0:4322:4322"

  frontend:
    image: oas-website-frontend:latest
    profiles: ["frontend"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        NODE_IMAGE: "${NODE_IMAGE:-docker.m.daocloud.io/library/node:26.13.1-bookworm-slim}"
        NGINX_IMAGE: "${NGINX_IMAGE:-docker.m.daocloud.io/library/nginx:1.27-alpine}"
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "0.0.0.0:4321:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mongo_data:
